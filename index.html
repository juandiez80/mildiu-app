<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mildiu EXPERTO</title>

<style>
body {font-family:Arial;background:#061012;color:white;text-align:center;padding:15px}
.card {background:#0f2529;border-radius:15px;padding:15px;margin:10px 0}
.semaforo {width:120px;height:120px;border-radius:50%;margin:10px auto;display:flex;align-items:center;justify-content:center;font-weight:bold}
.rojo{background:#ff3b3b}.amarillo{background:#ffd93b;color:black}.verde{background:#2ecc71}
#alerta{font-size:20px;margin-top:15px;color:#ffb347}
</style>
</head>

<body>

<h2>🍇 Mildiu EXPERTO</h2>

<div class="card">
<h3>📍 AHORA</h3>
<p>🌡️ <span id="temp"></span> °C</p>
<p>💧 <span id="hum"></span> %</p>
<div id="semHoy" class="semaforo">--</div>
</div>

<div class="card">
<h3>⏱️ PRÓXIMAS 48h (CLAVE)</h3>
<div id="horas"></div>
</div>

<div class="card">
<h3>🌧️ PREVISIÓN</h3>
<div id="dias"></div>
</div>

<div id="alerta"></div>

<script>
const lat = 36.87;
const lon = -6.18;

const meses = ["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];

// -------- MODELO HORARIO ----------
function calcularHoras(data){

  let consecutivas = 0;
  let maxHoras = 0;

  for(let i=0;i<data.time.length;i++){

    let temp = data.temperature_2m[i];
    let hum = data.relative_humidity_2m[i];

    if(hum >= 90 && temp >= 10 && temp <= 22){
      consecutivas++;
      if(consecutivas > maxHoras) maxHoras = consecutivas;
    } else {
      consecutivas = 0;
    }
  }

  return maxHoras;
}

// -------- SEMÁFORO ----------
function pintar(el, riesgo){
  el.className = "semaforo";
  if(riesgo==="ALTO"){el.classList.add("rojo");el.innerText="ALTO";}
  else if(riesgo==="MEDIO"){el.classList.add("amarillo");el.innerText="MEDIO";}
  else{el.classList.add("verde");el.innerText="BAJO";}
}

// -------- ACTUAL ----------
fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true&hourly=relative_humidity_2m&timezone=auto`)
.then(r=>r.json())
.then(d=>{
  document.getElementById("temp").innerText = d.current_weather.temperature.toFixed(1);
  document.getElementById("hum").innerText = d.hourly.relative_humidity_2m[0];
});

// -------- HORAS (CLAVE REAL) ----------
fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&hourly=temperature_2m,relative_humidity_2m&forecast_days=2&timezone=auto`)
.then(r=>r.json())
.then(d=>{

  let horas = calcularHoras(d.hourly);

  let riesgo = "BAJO";
  if(horas >= 10) riesgo = "ALTO";
  else if(horas >= 6) riesgo = "MEDIO";

  pintar(document.getElementById("semHoy"), riesgo);

  document.getElementById("horas").innerText =
    `Horas favorables consecutivas: ${horas}h`;

  if(horas >= 10){
    document.getElementById("alerta").innerText =
      "🔴 Infección probable → tratar";
  }
});

// -------- PREVISIÓN DIARIA ----------
fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&daily=temperature_2m_max,temperature_2m_min,precipitation_sum&timezone=auto`)
.then(r=>r.json())
.then(d=>{

  let html="";

  for(let i=1;i<6;i++){
    let fecha=new Date(d.daily.time[i]);
    let dia=fecha.getDate();
    let mes=meses[fecha.getMonth()];
    let rain=d.daily.precipitation_sum[i];

    html+=`<p>${dia} ${mes} → 🌧️ ${rain}mm</p>`;
  }

  document.getElementById("dias").innerHTML=html;
});

// auto refresh
setInterval(()=>location.reload(),300000);

</script>

</body>
</html>
